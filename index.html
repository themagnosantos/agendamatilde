<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F2849">
<title>AGENDA ESCOLAR · Inovação Educacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F4F6FA;            
  --surface:#FFFFFF;
  --surface-2:#FBFCFE;
  --ink:#1A202C;           
  --ink-soft:#5A6678;
  --ink-faint:#94A1B2;
  --line:#E7ECF3;
  --line-strong:#D8E0EB;
  --navy:#0F2849;          
  --navy-2:#1A4A7A;
  --teal:#12A28B;          
  --teal-d:#0E8472;
  --teal-soft:#E7F6F2;
  
  --c-log:#10B981;   --c-log-bg:#E9F9F1;     
  --c-lin:#D946EF;   --c-lin-bg:#FBEBFE;    
  --c-exa:#0284C7;   --c-exa-bg:#E6F2FB;    
  --c-hum:#F59E0B;   --c-hum-bg:#FEF3E0;     
  --c-div:#6366F1;   --c-div-bg:#ECEDFE;     
  --c-jud:#EA580C;   --c-jud-bg:#FDEEE6;     
  --c-int:#94A1B2;   --c-int-bg:#EEF1F6;     
  --danger:#E11D48;  --danger-bg:#FDE7EC;
  --ok:#10B981;
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(16,32,57,.05), 0 1px 3px rgba(16,32,57,.06);
  --sh-2:0 4px 14px rgba(16,32,57,.08), 0 2px 6px rgba(16,32,57,.05);
  --sh-3:0 18px 48px rgba(16,32,57,.16), 0 6px 16px rgba(16,32,57,.08);
  --ff:"Hanken Grotesk",-apple-system,system-ui,sans-serif;
  --fd:"Bricolage Grotesque",var(--ff);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--ff); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:0;height:0}


.app{
  display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(18,162,139,.07), transparent 55%),
    radial-gradient(120% 50% at 0% 100%, rgba(2,132,199,.06), transparent 55%),
    var(--bg);
  position:relative;
}


.topbar{
  background:linear-gradient(155deg,var(--navy) 0%, #123356 55%, var(--navy-2) 100%);
  color:#fff;padding:calc(var(--safe-t) + 12px) 16px 14px;flex:none;
  position:relative;z-index:20;box-shadow:0 6px 22px rgba(15,40,73,.22);
}
.topbar::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;
  background:radial-gradient(circle,rgba(18,162,139,.35),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.brand .logo{height:38px;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.brand .sep{width:1px;height:26px;background:rgba(255,255,255,.22)}
.brand .school b{font-family:var(--fd);font-weight:700;font-size:14px;display:block;letter-spacing:-.01em;line-height:1.1}
.brand .school span{font-size:10.5px;color:rgba(255,255,255,.66);font-weight:500;letter-spacing:.02em}
.brand .coordbtn{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);transition:.18s}
.brand .coordbtn:active{transform:scale(.92);background:rgba(255,255,255,.22)}
.brand .coordbtn svg{width:17px;height:17px}
.coordbtn.on{background:var(--teal);border-color:var(--teal)}


.searchwrap{margin-top:13px;position:relative;z-index:1}
.searchwrap input{
  width:100%;height:44px;border-radius:13px;border:none;padding:0 16px 0 42px;
  background:rgba(255,255,255,.96);color:var(--ink);font-weight:500;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
}
.searchwrap input::placeholder{color:#9AA6B6}
.searchwrap .sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#7E8AA0}
.searchwrap .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;display:none;place-items:center;color:#7E8AA0}
.searchwrap .clr.show{display:grid}
.suggest{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:var(--sh-3);
  max-height:46vh;overflow-y:auto;z-index:40;padding:6px;display:none}
.suggest.open{display:block}
.suggest .opt{padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.suggest .opt:active{background:var(--teal-soft)}
.suggest .opt .av{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-d);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.suggest .opt small{color:var(--ink-faint);font-size:11.5px}
.suggest .empty{padding:14px;text-align:center;color:var(--ink-faint);font-size:13px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 14px 96px}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}



.ctx{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.ctx .badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--navy),var(--navy-2));color:#fff;font-family:var(--fd);font-weight:800;font-size:17px;
  box-shadow:var(--sh-2)}
.ctx h2{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ctx p{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.ctx .right{margin-left:auto}


.timeline{position:relative;padding-left:54px}
.timeline::before{content:"";position:absolute;left:46px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl-block{position:relative;margin-bottom:9px}
.tl-time{position:absolute;left:-54px;top:2px;width:46px;text-align:right;font-variant-numeric:tabular-nums;
  font-weight:700;font-size:12px;color:var(--ink-soft);font-family:var(--fd)}
.tl-dot{position:absolute;left:-12px;top:7px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--line-strong);z-index:2}
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-1);
  border:1px solid var(--line);overflow:hidden;position:relative;transition:transform .12s, box-shadow .18s}
.card:active{transform:scale(.985)}
.tl-block .card{border-left:5px solid var(--cat,var(--c-int))}
.card.now{box-shadow:0 0 0 2px var(--teal), var(--sh-2)}
.card-in{padding:13px 14px}
.card-top{display:flex;align-items:flex-start;gap:9px}
.chip{font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:4px 9px;border-radius:999px;
  background:var(--catbg,var(--c-int-bg));color:var(--cat,var(--c-int));white-space:nowrap;flex:none}
.now-pill{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--teal);color:#fff;
  padding:4px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;flex:none}
.now-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card h3{font-family:var(--fd);font-size:15.5px;font-weight:700;letter-spacing:-.015em;margin-top:9px;line-height:1.2}
.card .who{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
.card .who svg{width:13px;height:13px;color:var(--ink-faint);flex:none}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);
  padding:4px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.tag svg{width:12px;height:12px}
.tag.room{color:var(--navy-2);border-color:#CFE0F2;background:#EEF5FC}


.invbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 11px;border-radius:10px;
  background:var(--c-log-bg);color:var(--c-log);margin-top:10px}
.invbadge.warn{background:var(--danger-bg);color:var(--danger);animation:shake .5s 1}
.invbadge .em{font-size:14px}
@keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(2px)}50%{transform:translateX(-2px)}}


.exc-ribbon{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.03em;
  color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;padding:3px 8px;border-radius:999px;margin-top:9px}
.exc-ribbon svg{width:12px;height:12px}


.tl-interval{position:relative;margin:0 0 9px}
.tl-interval .line{display:flex;align-items:center;gap:8px;color:var(--c-int);font-size:11px;font-weight:700}
.tl-interval .line .d{flex:1;border-top:2px dashed var(--line-strong)}
.tl-interval .tl-dot{border-color:var(--c-int);top:50%;transform:translateY(-50%)}


.weekscroll{overflow-x:auto;border-radius:var(--r-l);box-shadow:var(--sh-1);border:1px solid var(--line);background:#fff}
.weekgrid{display:grid;min-width:560px}
.wg-head{display:contents}
.wg-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;min-height:62px}
.wg-time{position:sticky;left:0;background:var(--surface-2);z-index:3;border-right:1px solid var(--line-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  font-weight:800;font-size:11px;color:var(--ink-soft);min-width:50px;padding:6px 4px}
.wg-time small{font-weight:600;color:var(--ink-faint);font-size:9px}
.wg-dhead{position:sticky;top:0;background:var(--navy);color:#fff;z-index:4;font-family:var(--fd);font-weight:700;
  font-size:11.5px;text-align:center;padding:9px 4px;border-right:1px solid rgba(255,255,255,.12)}
.wg-dhead.today{background:var(--teal)}
.wg-corner{position:sticky;left:0;top:0;z-index:6;background:var(--navy);min-width:50px;border-right:1px solid rgba(255,255,255,.12)}
.wmini{font-size:10.5px;line-height:1.25;border-radius:8px;padding:5px 6px;height:100%;
  background:var(--catbg,var(--c-int-bg));border-left:3px solid var(--cat,var(--c-int))}
.wmini b{display:block;font-weight:800;color:var(--cat,var(--c-int));font-size:10px;letter-spacing:.01em}
.wmini span{color:var(--ink-soft);font-size:9.5px;display:block;margin-top:1px}
.wmini.int{background:#FEF9C3;border-left-color:#FACC15;border-color:#FDE68A}
.wmini.int b{color:#A16207}
.wmini.warn{box-shadow:inset 0 0 0 1.5px var(--danger)}
/* SUBSTITUIÇÃO na grade: retângulo vermelho preenchido + borda vermelha */
.wmini.exc{background:#FFE1E7 !important;border:2px solid var(--danger) !important;border-left:4px solid var(--danger) !important}
.wmini.exc b{color:var(--danger) !important}
.wmini .subtag{display:inline-block;margin-top:4px;font-size:8px;font-weight:800;letter-spacing:.05em;
  color:#fff;background:var(--danger);border-radius:5px;padding:1px 6px}


.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);
  padding:14px;display:flex;align-items:center;gap:13px;transition:transform .12s}
.row:active{transform:scale(.99)}
.row .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:20px}
.row .tx{flex:1;min-width:0}
.row .tx b{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:-.01em}
.row .tx p{font-size:12px;color:var(--ink-soft);margin-top:2px}
.row .chev{color:var(--ink-faint);flex:none}
.grad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}


.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);padding:15px;position:relative;overflow:hidden}
.ecard .etop{display:flex;align-items:center;gap:11px}
.ecard .eic{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);display:grid;place-items:center;font-size:23px;flex:none}
.ecard h3{font-family:var(--fd);font-size:15px;font-weight:700}
.ecard .esub{font-size:11.5px;color:var(--ink-soft)}
.ebar{height:9px;border-radius:999px;background:#EAEEF4;margin-top:13px;overflow:hidden;display:flex}
.ebar i{display:block;height:100%}
.ebar .use{background:var(--teal)}
.ebar .mnt{background:#F59E0B}
.estat{display:flex;gap:14px;margin-top:11px;font-size:12px}
.estat div b{font-family:var(--fd);font-size:18px;display:block;line-height:1}
.estat div span{color:var(--ink-faint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.peak{margin-top:12px;font-size:11.5px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft)}
.peak.warn{background:var(--danger-bg);border-color:#F7C9D4;color:var(--danger);font-weight:700}


.empty-state{text-align:center;padding:54px 20px;color:var(--ink-faint)}
.empty-state .e{font-size:40px;margin-bottom:10px}
.empty-state b{display:block;color:var(--ink-soft);font-family:var(--fd);font-size:16px;margin-bottom:4px}
.empty-state p{font-size:13px}


.bottomnav{flex:none;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));z-index:30;
  box-shadow:0 -4px 22px rgba(16,32,57,.06)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:14px;
  color:var(--ink-faint);transition:.16s}
.bottomnav button svg{width:23px;height:23px;transition:.16s}
.bottomnav button span{font-size:10.5px;font-weight:700;letter-spacing:.01em}
.bottomnav button.on{color:var(--teal-d)}
.bottomnav button.on svg{transform:translateY(-1px)}
.bottomnav button.on .nicon{background:var(--teal-soft)}
.bottomnav .nicon{padding:5px 16px;border-radius:13px;transition:.16s}


.scrim{position:fixed;inset:0;background:rgba(15,28,45,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;max-height:90dvh;overflow-y:auto;
  padding:8px 18px calc(24px + var(--safe-b));box-shadow:var(--sh-3);animation:slideup .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:999px;background:var(--line-strong);margin:8px auto 14px}
.sheet h2{font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.sheet .sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:12px;
  padding:12px 14px;background:#fff;color:var(--ink);font-weight:500;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field textarea{min-height:64px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;transition:.16s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 6px 18px rgba(18,162,139,.32)}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{flex:1}


.coord-sec{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden}
.coord-sec>summary{padding:15px;font-weight:700;font-family:var(--fd);font-size:15px;display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer}
.coord-sec>summary::-webkit-details-marker{display:none}
.coord-sec>summary .ci{width:34px;height:34px;border-radius:10px;background:var(--teal-soft);display:grid;place-items:center;flex:none}
.coord-sec>summary .ar{margin-left:auto;transition:.2s;color:var(--ink-faint)}
.coord-sec[open]>summary .ar{transform:rotate(90deg)}
.coord-sec .body{padding:0 15px 15px}
.minrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.minrow .nm{flex:1;font-size:13px;font-weight:600;min-width:0}
.minrow .nm small{display:block;color:var(--ink-faint);font-size:11px;font-weight:500}
.numbox{width:62px;text-align:center;border:1px solid var(--line-strong);border-radius:10px;padding:8px 4px;font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.linkpill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px;font-size:12.5px}
.linkpill .x{margin-left:auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--danger);background:var(--danger-bg)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:13px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);z-index:80;opacity:0;transition:.28s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}


.summary-overlay{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;flex-direction:column}
.summary-overlay.open{display:flex}
.sum-bar{background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;flex:none}
.sum-bar h2{font-family:var(--fd);font-size:16px;font-weight:700;flex:1}
.sum-bar h2 span{display:block;font-size:11px;color:rgba(255,255,255,.7);font-weight:500}
.sum-bar button{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.sum-body{flex:1;overflow-y:auto;padding:16px 14px 16px}
.sum-actions{flex:none;padding:12px 14px calc(12px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.sum-class{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);margin-bottom:13px;overflow:hidden;break-inside:avoid}
.sum-class h3{font-family:var(--fd);font-size:14px;font-weight:700;background:var(--surface-2);padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.sum-class h3 .tn{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-faint)}
.sum-slot{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid var(--line)}
.sum-slot:last-child{border-bottom:none}
.sum-slot .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;color:var(--ink-soft);width:42px;flex:none;font-family:var(--fd)}
.sum-slot .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--cat,var(--c-int));flex:none}
.sum-slot .si{flex:1;min-width:0}
.sum-slot .si b{font-size:13px;font-weight:700;display:block}
.sum-slot .si span{font-size:11px;color:var(--ink-soft)}

@media print{

  if(/LOGISTIC|LOGÍSTIC|AUTOMA|COM[ÉE]RCIO EXTERIOR|COMPRAS|SUPRIMENTO|ESTOQUE|TRANSPORTE|DISTRIBUI|REVERSA|CARREIRA E COMP|TECNOLOGIA E INOVA|PROJETO MULTI/.test(d)) return "log";

  if(/HIST[ÓO]RIA|GEOGRAFIA|FILOSOFIA|SOCIOLOGIA|APROFUNDAMENTO|ATUALIDADES/.test(d)) return "hum";
  if(/EDUCA[ÇC][ÃA]O F[ÍI]SICA|EDUCACAO FISICA|ESPORTE|EMA/.test(d)) return "jud";

}

function loadExceptions(){
  let o={}; try{o=JSON.parse(localStorage.getItem(LS.exc))||{};}catch(e){o={};}
  return o;
}
function pruneExceptions(){
  const o=loadExceptions(); const now=Date.now(); let changed=false;
  for(const k in o){ if(now - o[k].ts > 24*60*60*1000){ delete o[k]; changed=true; } }
  if(changed) localStorage.setItem(LS.exc, JSON.stringify(o));
  return o;
}
function excKey(className,day,time){ return className+"|"+day+"|"+time; }
function saveException(className,day,time,data){
  const o=loadExceptions();
  o[excKey(className,day,time)]={ts:Date.now(), ...data};
  localStorage.setItem(LS.exc, JSON.stringify(o));
}
function removeException(className,day,time){
  const o=loadExceptions(); delete o[excKey(className,day,time)];
  localStorage.setItem(LS.exc, JSON.stringify(o));
}
function effectiveSlot(slot, className){
  const o=state.exceptions; const e=o[excKey(className,slot.day,slot.t)];
  if(!e) return {...slot, _exc:null};
  return {...slot, d:e.d||slot.d, p:e.p||slot.p, room:e.room||"", note:e.note||"", _exc:e};
}


function csvToRows(text){
  const rows=[]; let row=[]; let f=""; let q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===';'){ row.push(f); f=""; }
      else if(ch==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
      else f+=ch;
    }
  }
  row.push(f); rows.push(row);
  return rows;
}
function parseCell(c){
  c=(c||"").trim(); if(!c) return null;
  const m=c.match(/^\[(\d{2}:\d{2})\]/);
  if(!m) return null;
  const time=m[1];
  const rest=c.slice(m[0].length).trim();
  const lines=rest.split("\n").map(s=>s.trim()).filter(Boolean);
  return {t:time, d:lines[0]||"", p:lines[1]||""};
}
function parseCSV(text){
  const rows=csvToRows(text);
  const classes=[]; let cur=null, period=null;
  for(const r of rows){
    const first=(r[0]||"").trim();
    if(/^Turma:/i.test(first)){ cur={name:first.replace(/^Turma:/i,"").trim(), slots:[]}; classes.push(cur); period=null; continue; }
    if(first==="Manhã"||first==="Manha"){ period="M"; continue; }
    if(first==="Tarde"){ period="T"; continue; }
    if(/^Segunda-feira/i.test(first)) continue;
    if(!cur) continue;
    for(let di=0; di<5; di++){
      const p=parseCell(r[di]);
      if(p) cur.slots.push({day:di, per:period, t:p.t, d:p.d, p:p.p});
    }
  }
  return classes.filter(c=>c.slots.length);
}


function toMin(hhmm){const[a,b]=hhmm.split(":").map(Number);return a*60+b;}
function fmtMin(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
function durationOf(slot){ return /^INTERVALO$/i.test((slot.d||"").trim())?15:50; }
function isInterval(slot){ return /INTERVALO/i.test(slot.d||""); }
function nowInfo(){
  const dt=new Date(); let jd=dt.getDay(); 
  const dayIdx = (jd>=1&&jd<=5)? jd-1 : -1;
  return {dayIdx, min:dt.getHours()*60+dt.getMinutes(), weekend:(jd===0||jd===6)};
}
function todayIdx(){ const j=new Date().getDay(); return (j>=1&&j<=5)?j-1:0; }

function unionTimes(slots){
  const s=new Set(slots.map(x=>x.t));
  return [...s].sort((a,b)=>toMin(a)-toMin(b));
}


function splitTeachers(str){
  if(!str) return [];
  return str.split(/\s*[-+]\s*/).map(s=>s.trim()).filter(s=>s.length>2);
}
function buildIndexes(){
  const teacherMap=new Map();
  state.base.forEach(c=>{
    c.slots.forEach(s=>{
      splitTeachers(s.p).forEach(name=>{
        if(!teacherMap.has(name)) teacherMap.set(name,[]);
        teacherMap.get(name).push({className:c.name, slot:s});
      });
    });
  });
  state.teachers=[...teacherMap.keys()].sort((a,b)=>a.localeCompare(b,'pt'));
  state.teacherMap=teacherMap;
}
function initials(name){
  const p=name.split(/\s+/).filter(Boolean);
  return ((p[0]||"")[0]||"")+((p[1]||"")[0]||(p[0]||"")[1]||"");
}
function shortName(name){
  const p=name.split(/\s+/);
  if(p.length<=2) return name;
  return p[0]+" "+p[p.length-1];
}


function classSize(name){ return (state.inv.classSizes&&state.inv.classSizes[name])||0; }
function requiredEquip(disc){
  const d=(disc||"").toUpperCase(); const out=[];
  state.inv.links.forEach(l=>{ if(l.match && d.includes(l.match.toUpperCase())) out.push(l); });
  return out;
}
function concurrentDemand(day,time,equipId){
  let total=0;
  state.base.forEach(c=>{
    c.slots.forEach(s=>{
      if(s.day!==day||s.t!==time) return;
      const eff=effectiveSlot(s,c.name);
      requiredEquip(eff.d).forEach(l=>{
        if(l.equip!==equipId) return;
        total += Math.ceil(classSize(c.name)*l.ratio);
      });
    });
  });
  return total;
}
function availabilityFor(slot, className){
  const eff=effectiveSlot(slot,className);
  const reqs=requiredEquip(eff.d);
  if(!reqs.length) return null;
  return reqs.map(l=>{
    const eq=state.inv.equipments.find(e=>e.id===l.equip); if(!eq) return null;
    const capacity = Math.max(0, eq.total - eq.maintenance);
    const myNeed   = Math.ceil(classSize(className)*l.ratio);
    const others   = concurrentDemand(slot.day,slot.t,eq.id) - myNeed;
    const availForMe = capacity - Math.max(0,others);
    return {eq, capacity, myNeed, availForMe, ok: myNeed<=availForMe};
  }).filter(Boolean);
}

function getLiveBanner(entries, ctx, name) {
    const ni = nowInfo();
    if (ni.dayIdx < 0) return `<div class="peak">☕ Fora do horário letivo (Fim de semana).</div>`;
    const liveEntry = entries.find(e => {
        const start = toMin(e.slot.t);
        const end = start + durationOf(e.slot);
        return e.slot.day === ni.dayIdx && ni.min >= start && ni.min < end;
    });
    if (!liveEntry) return `<div class="peak" style="margin-bottom:14px">☕ Nenhuma aula ao vivo no momento para ${titleCase(shortName(name))}.</div>`;
    
    const eff = effectiveSlot(liveEntry.slot, liveEntry.className);
    if (isInterval(eff)) return `<div class="peak" style="margin-bottom:14px">☕ Intervalo no momento.</div>`;

    let txt = "";
    let local = eff.room ? `na sala <b>${eff.room}</b>` : (ctx === "grade" ? `na turma <b>${liveEntry.className}</b>` : `nesta turma`);
    if (ctx === "grade") {
        txt = `<b>🔴 AO VIVO:</b> Ministrando <b>${titleCase(eff.d)}</b> ${local}.`;
    } else {
        txt = `<b>🔴 AO VIVO:</b> Aula de <b>${titleCase(eff.d)}</b> com prof. <b>${titleCase(shortName(eff.p))}</b> ${local}.`;
    }
    return `<div class="peak warn" style="background:#FDE7EC;color:#E11D48;border-color:#F7C9D4;margin-bottom:14px;font-size:13.5px;padding:12px;display:flex;align-items:center;gap:8px">
      <span style="animation:pulse 1.4s infinite">🔴</span> <span>${txt}</span>
    </div>`;
}

function renderWeekGrid(entries, ctx){
  const allSlots = entries.map(e=>({...e.slot, className:e.className}));
  if(!allSlots.length) return emptyState("📭","Sem aulas","Nenhuma aula registrada.");
  const times=unionTimes(allSlots);
  const map={};
  allSlots.forEach(s=>{ map[s.day+"|"+s.t]=s; });
  const ti=todayIdx();
  let html=`<div class="weekscroll"><div class="weekgrid" style="grid-template-columns:50px repeat(5,1fr)">
    <div class="wg-corner"></div>`;
  DAYS_SHORT.forEach((d,i)=>{ html+=`<div class="wg-dhead ${i===ti?'today':''}">${d}</div>`; });
  times.forEach(t=>{
    html+=`<div class="wg-cell wg-time">${t}<small>${fmtMin(toMin(t)+50)}</small></div>`;
    for(let di=0;di<5;di++){
      const s=map[di+"|"+t];
      if(!s){ html+=`<div class="wg-cell"></div>`; continue; }
      const eff=effectiveSlot(s,s.className);
      if(isInterval(eff)){ html+=`<div class="wg-cell"><div class="wmini int"><b>Intervalo</b></div></div>`; continue; }
      const cat=CAT[categoryOf(eff.d)];
      let warn=false;
      if(ctx==="grade"){const av=availabilityFor(s,s.className);if(av)warn=av.some(a=>!a.ok);}
      const second = ctx==="grade"? "Turma "+s.className : (eff.p?titleCase(shortName(eff.p)):"");
      const isExc = !!eff._exc;
      const subTag = isExc ? `<span class="subtag">SUBST</span>` : "";
      html+=`<div class="wg-cell"><div class="wmini ${warn?'warn':''} ${isExc?'exc':''}" style="--cat:${cat.c};--catbg:${cat.bg}" onclick='openSlot(${JSON.stringify(JSON.stringify(s))},${JSON.stringify(s.className)})'>
        <b>${abbr(eff.d)}</b><span>${second}</span>${subTag}</div></div>`;
    }
  });
  html+=`</div></div><p style="font-size:11px;color:var(--ink-faint);margin-top:8px;text-align:center">Deslize na horizontal para ver todos os dias →</p>`;
  return html;
}

function emptyState(e,b,p){return `<div class="empty-state"><div class="e">${e}</div><b>${b}</b><p>${p}</p></div>`;}
function titleCase(s){
  if(!s) return "";
  const low=["de","da","do","das","dos","e","a","o","em","para","com","–","-"];
  return s.toLowerCase().split(/\s+/).map((w,i)=>{
    if(i>0&&low.includes(w))return w;
    if(/^[ivx]+$/.test(w))return w.toUpperCase();
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ").replace(/\bEma\b/,"EMA").replace(/\bAtpcg\b/i,"ATPCG");
}

// Excluir um equipamento e todos os vínculos associados a ele
function delEquip(id){
  const eq = state.inv.equipments.find(e=>e.id===id);
  if(!eq) return;
  if(!confirm(`Excluir "${eq.name}" do inventário?\nOs vínculos relacionados a este equipamento também serão removidos.`)) return;
  state.inv.equipments = state.inv.equipments.filter(e=>e.id!==id);
  state.inv.links      = state.inv.links.filter(l=>l.equip!==id);
  saveInv(state.inv);
  showCoordPanel();
  toast("Equipamento removido ✓");
}

function resetBase(){

  localStorage.removeItem(LS.base); state.base=loadBase();
  state.base.forEach(c=>{if(!(c.name in state.inv.classSizes))state.inv.classSizes[c.name]=38;});

  state.selClass=state.base[0].name; closeSheet(); render(); toast("Horário original restaurado ✓");
}
function handleCSVUpload(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    const buf=ev.target.result; let text;
    try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(_){ text=new TextDecoder("windows-1252").decode(buf); }
    try{
      const parsed=parseCSV(text);
      if(!parsed.length){toast("Nenhuma turma encontrada no arquivo");return;}
      state.base=parsed; saveBase(parsed);
      parsed.forEach(c=>{if(!(c.name in state.inv.classSizes))state.inv.classSizes[c.name]=38;});
      saveInv(state.inv); buildIndexes();
      state.selTeacher=null;
      state.selClass=parsed[0].name;
      closeSheet(); render(); toast(`✓ ${parsed.length} turmas importadas`);
    }catch(err){ toast("Erro ao ler o CSV"); }
  };
  r.readAsArrayBuffer(file);
}

// Cabeçalho padronizado de cada página do PDF
function buildPrintHeader(subtitle){
  const d = new Date();
  const pad = n=>String(n).padStart(2,"0");
  const dateStr = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `<div class="prn-hdr">
    ${PRINT_LOGO_SVG}
    <div class="ttl"><b>AGENDA ESCOLAR</b><small>${esc(subtitle)} · Matilde Maria Cremm</small></div>
    <div class="date">Gerado em<br>${dateStr}</div>
  </div>`;
}

// Mini tabela semanal compacta para um conjunto de entradas (entries=[{className,slot}])
// ctx: "turma" mostra o nome do professor; "prof" mostra a turma
function buildMiniWeek(entries, ctx){
  // Reúne todos os horários, ordenados
  const times = unionTimes(entries.map(e=>e.slot));
  // Mapeia [time|day] -> slot/className
  const map = {};
  entries.forEach(e=>{ map[e.slot.day+"|"+e.slot.t] = {slot:e.slot, className:e.className}; });
  let html = `<table class="prn-w"><thead><tr><th style="width:30px">H</th>`;
  DAYS_SHORT.forEach(d=>{ html+=`<th>${d}</th>`; });
  html += `</tr></thead><tbody>`;
  times.forEach(t=>{
    html += `<tr><td class="tm">${t}</td>`;
    for(let d=0; d<5; d++){
      const cell = map[d+"|"+t];
      if(!cell){ html+=`<td></td>`; continue; }
      const eff = effectiveSlot(cell.slot, cell.className);
      if(isInterval(eff)){ html+=`<td class="itv">Intervalo</td>`; continue; }
      const second = ctx==="turma" ? (eff.p?titleCase(shortName(eff.p)):"—") : cell.className;
      const subMarker = eff._exc ? `<div class="sub">⚠ SUBST: ${esc(titleCase(shortName(eff.p)||"a definir"))}</div>` : "";
      html += `<td class="${eff._exc?'exc':''}"><div class="d">${esc(titleCase(eff.d))}</div><div class="p">${esc(second)}</div>${subMarker}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

// PDF Geral por Turma — uma página com todas as turmas (2 por linha)
// Nome de arquivo sugerido para o PDF: edumind_agenda_DD_MM_AAAA
function pdfFileName(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `EDUMIND AGENDA ${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}

}

// ---- Montagem dos relatórios (retorna HTML) — usado pela impressão E pelo compartilhamento ----
function buildReport(kind){
  if(kind==="turma"){
    const ord = c=>{ let p=2; if(/\b[6-9]\s*[°ºo]?\s*ANO\b/i.test(c.name)) p=0; else if(/\b[1-3]\s*[ªa]?\s*S[EÉ]RIE\b/i.test(c.name)) p=1; const m=c.name.match(/(\d+)/); return p*1000+(m?parseInt(m[1])*10:99)+(c.name.charCodeAt(c.name.length-1)||0)/1000; };
    const sorted=[...state.base].sort((a,b)=>ord(a)-ord(b));
    let pages=`<div class="prn-page">${buildPrintHeader("Grade Semanal · Todas as Turmas")}<div class="prn-section-title">📚 Turmas (${sorted.length}) — semana completa, todos os dias e horários</div><div class="prn-grid">`;
    sorted.forEach(c=>{ const entries=c.slots.map(s=>({className:c.name,slot:s})); pages+=`<div class="prn-card"><h4>🏫 ${esc(c.name)} · ${c.slots.filter(s=>!isInterval(s)).length} aulas</h4>${buildMiniWeek(entries,"turma")}</div>`; });
    return pages+`</div></div>`;
  }
  if(kind==="prof"){
    const teachers=[...state.teachers].sort((a,b)=>a.localeCompare(b,'pt'));
    let pages=`<div class="prn-page">${buildPrintHeader("Grade Semanal · Todos os Professores")}<div class="prn-section-title">👨‍🏫 Professores (${teachers.length}) — semana completa, com substituições destacadas</div><div class="prn-grid">`;
    teachers.forEach(t=>{ const entries=state.teacherMap.get(t)||[]; if(!entries.length)return; const turmas=new Set(entries.map(e=>e.className)).size; pages+=`<div class="prn-card"><h4>👤 ${esc(titleCase(t))} · ${entries.length} aulas · ${turmas} turmas</h4>${buildMiniWeek(entries,"prof")}</div>`; });
    return pages+`</div></div>`;
  }
  // dia (Visão Geral)
  const day=todayIdx();
  let body=`<div class="prn-page">${buildPrintHeader("Resumo do Dia · "+DAYS_FULL[day])}<div class="prn-section-title">🗓️ Aulas de ${DAYS_FULL[day]} — todas as turmas</div><div class="prn-grid">`;

/* ================================================================
   COMPARTILHAR PDF NO WHATSAPP
   Gera um PDF (A4 paisagem) do relatório e abre o menu de
   compartilhamento do aparelho (que inclui o WhatsApp no celular).
   Bibliotecas carregadas sob demanda; se falharem, cai para texto.
   ================================================================ */
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(true); s.onerror=()=>rej(new Error("falha: "+src)); document.head.appendChild(s); });
}
async function ensurePdfLibs(){
  if(window.html2canvas && window.jspdf) return true;
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf)        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  return !!(window.html2canvas && window.jspdf);
}
// Renderiza o #printRoot (já preenchido) num Blob PDF paisagem multipágina
async function generatePdfBlob(){
  const root=$("printRoot");
  const prev=root.getAttribute("style")||"";
  // visível fora da área visível para o html2canvas medir o layout
  root.setAttribute("style","display:block;position:fixed;left:0;top:0;width:1123px;background:#fff;z-index:-1;opacity:1");
  let canvas;
  try{ canvas=await html2canvas(root,{scale:2,backgroundColor:"#ffffff",useCORS:true,windowWidth:1123}); }
  finally{ root.setAttribute("style", prev || "display:none"); }
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
  const imgH=canvas.height*pw/canvas.width;
  const img=canvas.toDataURL("image/jpeg",0.92);
  let heightLeft=imgH, position=0;
  pdf.addImage(img,"JPEG",0,position,pw,imgH);
  heightLeft-=ph;
  while(heightLeft>0){ position-=ph; pdf.addPage(); pdf.addImage(img,"JPEG",0,position,pw,imgH); heightLeft-=ph; }
  return pdf.output("blob");
}
const _waLabel={turma:"Grade por Turma",prof:"Grade por Professor",dia:"Resumo do Dia"};
async function shareWhatsApp(kind){
  closeSheet();
  toast("Gerando PDF para o WhatsApp…");
  $("printRoot").innerHTML=buildReport(kind);
  const fname=pdfFileName()+".pdf";
  const caption=`📅 *AGENDA ESCOLAR* — ${_waLabel[kind]||"Agenda"}\n🏫  Matilde Maria Cremm`;
  try{
    if(!(await ensurePdfLibs())) throw new Error("libs indisponíveis");
    const blob=await generatePdfBlob();
    const file=new File([blob],fname,{type:"application/pdf"});
    // Caminho ideal (celular): compartilha o arquivo direto -> escolhe WhatsApp
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"AGENDA ESCOLAR", text:caption});
      toast("Pronto! Escolha o WhatsApp ✓");
      return;
    }
    // Computador / sem Web Share: baixa o PDF e abre o WhatsApp Web para anexar
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    window.open("https://wa.me/?text="+encodeURIComponent(caption+`\n\n(anexe o arquivo "${fname}" que acabou de ser baixado)`),"_blank");
    toast("PDF baixado — anexe no WhatsApp");
  }catch(e){
    // Último recurso: compartilha o texto da agenda do dia
    let txt; try{ txt=buildWAText(); }catch(_){ txt=caption; }
    if(navigator.share){ try{ await navigator.share({title:"AGENDA ESCOLAR", text:txt}); toast("Enviado como texto"); return; }catch(_){ } }
    window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
    toast("Sem suporte a PDF aqui — enviei o texto");
  }
}

function fallbackCopy(txt,cb){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){toast("Não foi possível copiar");}document.body.removeChild(ta);}

function runSearch(q){
  const box=$("suggest"); q=q.trim().toLowerCase();
  $("clrBtn").classList.toggle("show",q.length>0);
  if(!q){ box.classList.remove("open"); return; }
  let items=[];
  if(state.tab==="grade"){
    items=state.teachers.filter(t=>t.toLowerCase().includes(q)).slice(0,30).map(t=>({
      label:titleCase(t), sub:(state.teacherMap.get(t)||[]).length+" aulas", av:initials(t), act:`pickTeacher(${JSON.stringify(t)})`
    }));
  }else if(state.tab==="turmas"){
    items=state.base.filter(c=>c.name.toLowerCase().includes(q)).map(c=>({
      label:c.name, sub:c.slots.filter(s=>!isInterval(s)).length+" aulas", av:turmaTag(c.name), act:`pickClass(${JSON.stringify(c.name)})`
    }));
  }else{
    items=state.inv.equipments.filter(e=>e.name.toLowerCase().includes(q)).map(e=>({
      label:e.name, sub:(e.total-e.maintenance)+" disponíveis", av:e.icon, act:`closeSuggest()`
    }));
  }
  box.innerHTML = items.length? items.map(it=>`<div class="opt" onclick='${it.act};closeSuggest()'>
    <span class="av">${it.av}</span><div><div style="font-weight:600;font-size:13.5px">${it.label}</div><small>${it.sub}</small></div></div>`).join("")
    : `<div class="empty">Nada encontrado para "${q}"</div>`;
  box.classList.add("open");
}

// Ausências e cobertura: registros por data, sem alterar a grade semanal.
const CV_KEY='agenda_cobertura_v1';
function cvLoad(){try{const v=JSON.parse(localStorage.getItem(CV_KEY));if(v&&Array.isArray(v.records)&&Array.isArray(v.covers))return v;}catch(e){}return {records:[],covers:[],areas:{}};}
let cvData=cvLoad();
const cv={teacher:'',date:'',time:'',live:true,lesson:'',filter:'all'};
const CV_AREAS={lin:'Linguagens',mat:'Matemática',nat:'Ciências da Natureza',hum:'Ciências Humanas',tec:'Ensino Técnico / Logística',unknown:'Área a confirmar'};
function cvNorm(s){return String(s||'').trim().replace(/\s+/g,' ').toLocaleUpperCase('pt-BR');}
function cvH(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function cvToday(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function cvClock(){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());}
function cvDay(date){return new Date(date+'T12:00:00').getDay()-1;}
function cvOverlap(a,b,c,d){return a<d&&c<b;}
function cvId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function cvSave(){try{localStorage.setItem(CV_KEY,JSON.stringify(cvData));return true;}catch(e){toast('Não foi possível salvar. Verifique o armazenamento do navegador.');return false;}}
function cvNames(){const names=new Map();state.base.forEach(c=>c.slots.forEach(s=>splitTeachers(s.p).forEach(p=>{if(!names.has(cvNorm(p)))names.set(cvNorm(p),p.trim().replace(/\s+/g,' '));})));cvData.covers.forEach(c=>{if(!names.has(cvNorm(c.teacher)))names.set(cvNorm(c.teacher),c.teacher);});return [...names.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function cvArea(d){const n=cvNorm(d).normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/PROJETO DE VIDA|ELETIVA|TUTORIA|ATPC|CLUBE|ORATORIA|FINANCEIRA|\bEMA\b|ESPORTE-MUSICA/.test(n))return null;if(/EDUCACAO FISICA|JUDO|PORTUGUES|REDACAO|INGLE|\bARTE\b|MIDIAS DIGITAIS/.test(n))return 'lin';if(/MATEMAT/.test(n))return 'mat';if(/FISICA|QUIMICA|BIOLOGIA|CIENCIA|PRATICAS EXPERIMENTAIS|ROBOTICA/.test(n))return 'nat';if(/HISTORIA|GEOGRAFIA|FILOSOFIA|SOCIOLOGIA/.test(n))return 'hum';if(categoryOf(d)==='log')return 'tec';return null;}
function cvDiscs(p){return [...new Set(state.base.flatMap(c=>c.slots.filter(s=>splitTeachers(s.p).some(t=>cvNorm(t)===cvNorm(p))&&!isInterval(s)).map(s=>s.d)))];}
function cvAreas(p){const manual=cvData.areas[cvNorm(p)];if(manual&&manual.length)return manual;const a=[...new Set(cvDiscs(p).map(cvArea).filter(Boolean))];return a.length?a:['unknown'];}
function cvRecords(p,date,start,end,kind){return cvData.records.filter(r=>cvNorm(r.teacher)===cvNorm(p)&&r.date===date&&(!kind||r.kind===kind)&&cvOverlap(start,end,r.start,r.end));}
function cvEffective(s,cls,date){let e={...s,_exc:null};const x=state.exceptions[excKey(cls,s.day,s.t)];if(s.day===cvDay(date)&&x&&(x.date?x.date===date:cvToday()===date&&cvToday()===new Date(x.ts).toLocaleDateString('sv-SE'))&&(!x.until||Date.now()<x.until)){e={...e,d:x.d||s.d,p:x.p||s.p,room:x.room||'',_exc:x};}const c=cvData.covers.find(c=>s.day===cvDay(date)&&c.date===date&&c.className===cls&&c.time===s.t);if(c)e={...e,p:[...splitTeachers(e.p).filter(p=>cvNorm(p)!==cvNorm(c.absent)),c.teacher].filter((p,i,a)=>a.findIndex(t=>cvNorm(t)===cvNorm(p))===i).join(' + '),_exc:{ts:c.ts,note:'Cobertura registrada',date:c.date},_cover:c};return e;}
function cvLessons(){const day=cvDay(cv.date);if(day<0||day>4)return [];return state.base.flatMap(c=>c.slots.filter(s=>s.day===day&&!isInterval(s)&&splitTeachers(s.p).some(p=>cvNorm(p)===cvNorm(cv.teacher))).map(s=>({className:c.name,slot:s,id:c.name+'|'+s.t}))).sort((a,b)=>toMin(a.slot.t)-toMin(b.slot.t));}
function cvTarget(){return cvLessons().find(l=>l.id===cv.lesson);}
function cvStatus(p,date,start,end){if(cvRecords(p,date,start,end,'absent').length||cvRecords(p,date,start,end,'blocked').length)return null;const day=cvDay(date);let conflict=false;state.base.forEach(c=>c.slots.forEach(s=>{if(s.day!==day||isInterval(s))return;const e=cvEffective(s,c.name,date);if(splitTeachers(e.p).some(t=>cvNorm(t)===cvNorm(p))&&cvOverlap(start,end,toMin(s.t),toMin(s.t)+durationOf(s)))conflict=true;}));if(conflict)return null;if(cvData.covers.some(c=>c.date===date&&cvNorm(c.teacher)===cvNorm(p)&&cvOverlap(start,end,c.start,c.end)))return null;return {confirmed:cvRecords(p,date,start,end,'confirmed').some(r=>r.start<=start&&r.end>=end)};}
function cvCandidates(l){const start=toMin(l.slot.t),end=start+durationOf(l.slot),area=cvArea(l.slot.d);return cvNames().filter(p=>cvNorm(p)!==cvNorm(cv.teacher)).map(p=>{const status=cvStatus(p,cv.date,start,end);if(!status)return null;const areas=cvAreas(p);return {p,areas,...status,same:cvDiscs(p).some(d=>cvNorm(d)===cvNorm(l.slot.d)),related:!!area&&areas.includes(area)};}).filter(Boolean).sort((a,b)=>Number(b.confirmed)-Number(a.confirmed)||Number(b.same)-Number(a.same)||a.p.localeCompare(b.p,'pt-BR'));}
function cvSet(field,value){cv[field]=value;if(field==='date'||field==='time'){cv.live=false;cv.lesson='';}if(field==='teacher')cv.lesson='';renderCoverage();}
function cvNow(){cv.date=cvToday();cv.time=cvClock();cv.live=true;cv.lesson='';renderCoverage();}
function cvRequire(){if(state.coord)return true;toast('Entre na área do coordenador para registrar alterações.');return false;}
function renderCoverage(){
 if(!cv.date){cv.date=cvToday();cv.time=cvClock();}
 const names=cvNames(),lessons=cvLessons(),minute=toMin(cv.time);if(!cv.lesson){const current=lessons.find(l=>toMin(l.slot.t)<=minute&&minute<toMin(l.slot.t)+durationOf(l.slot));if(current)cv.lesson=current.id;}
 const l=cvTarget(),candidates=l?cvCandidates(l):[],area=l?cvArea(l.slot.d):null;
 const options=names.map(n=>`<option value="${cvH(n)}"></option>`).join('');
 $('view-cover').innerHTML=`<div class="ctx"><div><h2>Ausências e cobertura</h2><p>Encontre cobertura por horário e área de conhecimento.</p></div></div>
 <div class="cv-panel"><div class="cv-fields"><label>Professor ausente<input id="cvTeacher" list="cvTeachers" value="${cvH(cv.teacher)}" placeholder="Digite ou selecione o professor" onchange="cvSet('teacher',this.value)"><datalist id="cvTeachers">${options}</datalist></label><label>Data<input type="date" value="${cv.date}" onchange="cvSet('date',this.value||cvToday())"></label><label>Horário<input type="time" value="${cv.time}" onchange="cvSet('time',this.value||cvClock())"></label><button class="btn btn-ghost" onclick="cvNow()">${cv.live?'● Agora':'Agora'}</button></div>
 <p class="cv-note">Horário de Brasília · Consulta pela grade semanal. Estar sem aula exige confirmação de presença e liberação. Registros salvos somente neste navegador e dispositivo.</p>
 ${!state.coord?'<button class="btn btn-navy" onclick="openCoord()">Entrar como coordenador</button>':'<span class="cv-badge">Modo coordenador ativo</span>'}</div>
 ${cv.teacher&&!names.some(n=>cvNorm(n)===cvNorm(cv.teacher))?'<div class="cv-panel">Selecione um professor cadastrado.</div>':''}
 ${cvDay(cv.date)<0||cvDay(cv.date)>4?'<div class="cv-panel">Fim de semana: não há aulas na grade semanal.</div>':''}

 ${l?`<div class="cv-panel"><h3>${cvH(l.className)} · ${cvH(l.slot.d)}</h3><p>${cvH(cv.teacher)} · ${cv.date.split('-').reverse().join('/')} · ${l.slot.t}–${fmtMin(toMin(l.slot.t)+durationOf(l.slot))}</p><div class="cv-badges"><span class="cv-badge">${candidates.filter(c=>c.confirmed).length} confirmados</span><span class="cv-badge pending">${candidates.filter(c=>!c.confirmed).length} a confirmar</span></div><p class="cv-note">Afinidade pela grade; não representa habilitação formal para substituir.</p><label>Filtrar candidatos<select onchange="cvSet('filter',this.value)"><option value="all">Todas as áreas</option><option value="same" ${cv.filter==='same'?'selected':''}>Mesma área da aula</option></select></label></div><div id="cvResults" aria-live="polite">${cvGroups(candidates,area,l)}</div>`:''}
 ${state.coord?cvManage(names,l):''}
 ${cvRecordList()}`;

function cvGroups(candidates,area,l){const shown=candidates.filter(c=>cv.filter!=='same'||c.related);if(!shown.length)return '<div class="cv-panel">Nenhum candidato sem conflito para esta aula e este filtro.</div>';const keys=Object.keys(CV_AREAS).sort((a,b)=>Number(b===area)-Number(a===area));return keys.map(key=>{const list=shown.filter(c=>c.areas.includes(key));if(!list.length)return '';return `<div class="cv-group cv-${key}"><h3>${CV_AREAS[key]} <span>(${list.length})</span></h3>${list.map(c=>`<article class="cv-candidate"><div><b>${cvH(titleCase(c.p))}</b><div class="cv-note">${c.areas.map(a=>CV_AREAS[a]).join(' · ')}</div><details><summary>Disciplinas na grade</summary><p>${cvH(cvDiscs(c.p).join(' · '))}</p></details><div class="cv-badges"><span class="cv-badge ${c.confirmed?'':'pending'}">${c.confirmed?'Disponível confirmado':'Sem aula na grade — confirmar disponibilidade'}</span>${c.same?'<span class="cv-badge">Mesma disciplina</span>':c.related?'<span class="cv-badge">Mesma área</span>':''}</div></div>${state.coord?`<button class="btn ${c.confirmed?'btn-primary':'btn-ghost'}" data-cvteacher="${cvH(c.p)}" onclick="${c.confirmed?'cvAssign(this.dataset.cvteacher)':'cvConfirm(this.dataset.cvteacher)'}">${c.confirmed?'Designar cobertura':'Confirmar disponibilidade'}</button>`:''}</article>`).join('')}</div>`;}).join('');}

<div class="cv-work-body"><aside class="cv-day-sidebar"><div class="cv-sidebar-title"><b>${cv.allDay?'Plano do dia':'Aulas do professor'}</b><small>${cvH(cvPrettyDate(cv.date))}</small></div>${cv.allDay?`<div class="cv-plan-summary"><b>${filled}/${lessons.length} aulas com sugestão</b><small>${completed} coberturas registradas</small>${filled<lessons.length?'<strong>Há aulas sem sugestão de cobertura.</strong>':''}</div>`:''}<div class="cv-timeline">${lessons.map((x,i)=>{const r=plan.find(r=>r.lesson.id===x.id),saved=cvData.covers.find(c=>c.date===cv.date&&c.className===x.className&&c.time===x.slot.t);return `<button class="cv-timeline-row ${x.id===cv.lesson?'selected':''}" data-lesson="${cvH(x.id)}" onclick="cvPickLesson(this.dataset.lesson)"><span class="cv-time-mini">${x.slot.t}<small>${fmtMin(toMin(x.slot.t)+durationOf(x.slot))}</small></span><span class="cv-timeline-detail"><b>${cvH(x.className)}</b><small>${cvH(x.slot.d)}</small>${cv.allDay?`<strong>${r?.candidate?cvH(titleCase(r.candidate.p)):'Sem candidato distinto'}</strong><em>${r?.saved?'✓ Cobertura registrada':r?.candidate?'Sugestão — confirmar e designar':'Necessário buscar cobertura'}</em>`:saved?`<strong>✓ ${cvH(titleCase(saved.teacher))}</strong>`:''}</span></button>`;}).join('')||'<p class="cv-empty">Selecione um professor com aulas nesta data.</p>'}</div></aside>
<section class="cv-candidate-workspace">${l?`<div class="cv-selected-title"><div><b>${l.slot.t} · ${cvH(l.className)}</b><span>${cvH(l.slot.d)} · ${cvH(CV_AREAS[area]||'Área principal a confirmar')}</span></div><small>${candidates.length} candidatos sem conflito${cv.allDay?' e sem reserva em outra aula':''}</small></div>
<div class="cv-spotlight ${suggested?.technicalFallback?'cv-last-resort':''}"><div><span class="cv-spotlight-label">${selectedPlan?.saved?'COBERTURA REGISTRADA':cv.allDay?'SUGESTÃO EXCLUSIVA PARA ESTA AULA':'PRIMEIRA RECOMENDAÇÃO'}</span><b>${suggested?cvH(titleCase(suggested.p)):'Nenhum candidato distinto disponível'}</b><p>${suggested?`${cvH(cvReasonShort(suggested,area==='tec'))} · ${cvDayLoad(suggested.p,cv.date)} aulas no dia.${suggested.confirmed?'':' Presença e liberação a confirmar.'}`:'Selecione outro horário ou revise as ausências e os impedimentos.'}</p></div>${state.coord&&suggested&&!selectedPlan?.saved?`<button class="btn btn-primary" data-person="${cvH(suggested.p)}" onclick="cvPlanAction(this.dataset.person)">${suggested.confirmed?'Designar cobertura':'Confirmar disponibilidade'}</button>`:''}</div>
<div class="cv-work-filters"><label>Área<select onchange="cvSet('filter',this.value)"><option value="all">Todas</option><option value="same" ${cv.filter==='same'?'selected':''}>Mesma área</option>${Object.entries(CV_AREAS).map(([k,v])=>`<option value="${k}" ${cv.filter===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Disponibilidade<select onchange="cvSet('status',this.value)"><option value="all">Todos</option><option value="confirmed" ${cv.status==='confirmed'?'selected':''}>Confirmados</option><option value="pending" ${cv.status==='pending'?'selected':''}>A confirmar</option></select></label><label>Ordenação<select onchange="cvSet('sort',this.value)">${[['loadAsc','Menos aulas ↑'],['loadDesc','Mais aulas ↓'],['nameAsc','Nome A–Z'],['nameDesc','Nome Z–A']].map(([k,v])=>`<option value="${k}" ${cv.sort===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Buscar<input type="search" value="${cvH(cv.query)}" placeholder="Nome" onchange="cvSet('query',this.value)"></label></div><div class="cv-candidates-scroll">${selectedPlan?.saved?'<div class="cv-empty">Esta aula já tem cobertura. Para alterá-la, cancele o registro em “Gerenciar registros”.</div>':cvCompactCards(candidates,l)}</div>`:'<div class="cv-work-empty"><b>Selecione uma aula ao lado</b><p>Ative “Dia todo” para ver uma sugestão para cada horário, sem repetir substitutos.</p></div>'}</section></div>`;
cvFitWorkspace();};
function cvFitWorkspace(){const el=$('view-cover');if(el?.getBoundingClientRect){const top=el.parentElement.getBoundingClientRect().top;el.style.setProperty('--cv-height',Math.max(380,window.innerHeight-top-8)+'px');}}
window.addEventListener('resize',cvFitWorkspace);

const cvManagedDelete=cvDelete;
cvDelete=function(id,type){cvManagedDelete(id,type);if(document.getElementById('cvManagement')&&document.getElementById('scrim').classList.contains('open'))cvOpenManagement();};
// Sugestões para a aula aberta, sem modificar os filtros da consulta principal.
let cvModal=null;
function cvSlotRecommendations(slot,className){const backup={...cv},teachers=splitTeachers(slot.p),today=cvToday();let date=today;const offset=(slot.day-cvDay(today)+7)%7;if(offset){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()+offset);date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}const absent=teachers.find(p=>cvNorm(p)===cvNorm(backup.teacher))||teachers[0]||'';try{cv.teacher=absent;cv.date=date;cv.time=slot.t;cv.lesson=className+'|'+slot.t;cv.filter='all';cv.status='all';cv.query='';cv.sort='loadAsc';const l={slot,className,id:cv.lesson},usePlan=backup.allDay&&backup.date===date&&cvNorm(backup.teacher)===cvNorm(absent),plan=usePlan?cvBuildPlan():[],list=cvVisible(usePlan?cvPlanCandidates(l,plan):cvCandidates(l)),planned=plan.find(r=>r.lesson.id===l.id)?.candidate;const recommended=planned&&list.find(c=>cvNorm(c.p)===cvNorm(planned.p))||list[0];return {slot,className,date,absent,list:recommended?[recommended,...list.filter(c=>cvNorm(c.p)!==cvNorm(recommended.p))]:list,recommended};}finally{Object.assign(cv,backup);}}
const cvBeforeRecommendedSlot=openSlot;
openSlot=function(slotJSON,className){cvBeforeRecommendedSlot(slotJSON,className);const slot=JSON.parse(slotJSON),info=cvSlotRecommendations(slot,className),eff=effectiveSlot(slot,className);cvModal=info;const current=eff._exc?eff.p:'',chosen=current||info.recommended?.p||'',field=$('exP');if(!field)return;field.outerHTML=`<select id="exP" onchange="cvModalChoose(this.value)"><option value="">${info.list.length?'Selecione o substituto':'Nenhum candidato disponível'}</option>${current&&!info.list.some(c=>cvNorm(c.p)===cvNorm(current))?`<option value="${cvH(current)}" selected>Registrado · ${cvH(titleCase(current))}</option>`:''}${info.list.map((c,i)=>`<option value="${cvH(c.p)}" ${cvNorm(c.p)===cvNorm(chosen)?'selected':''}>${i+1}º · ${cvH(titleCase(c.p))} · ${cvH(c.areas.map(a=>CV_AREAS[a]).join(' / '))} · ${c.load} aulas/dia${info.recommended&&cvNorm(c.p)===cvNorm(info.recommended.p)?' · Recomendado':''}</option>`).join('')}</select><div id="cvModalRanking" class="cv-modal-ranking"></div>`;cvModalDraw(chosen);const heading=$('sheet').querySelector('h3');if(heading)heading.textContent='Substituição da aula';const exButton=$('sheet').querySelector('[onclick^="applyExc"]');if(exButton){exButton.disabled=!chosen||info.date!==cvToday();exButton.textContent=info.date===cvToday()?'Salvar substituição':'Selecione uma aula de hoje para salvar';}const intro=heading?.nextElementSibling;if(intro?.tagName==='P')intro.textContent=info.date.split('-').reverse().join('/')+' · '+slot.t+'–'+fmtMin(toMin(slot.t)+durationOf(slot))+' · '+className;};
function cvModalDraw(selected){if(!cvModal||!$('cvModalRanking'))return;const info=cvModal;$('cvModalRanking').innerHTML=`<div class="cv-modal-rank-title"><b>Classificação dos substitutos</b><span>${info.list.length} disponíveis</span></div><div class="cv-modal-rank-grid">${info.list.map((c,i)=>`<button type="button" class="cv-modal-candidate ${cvNorm(c.p)===cvNorm(selected)?'selected':''}" data-person="${cvH(c.p)}" onclick="cvModalChoose(this.dataset.person)"><span class="cv-modal-order">${i+1}º</span><span><b>${cvH(titleCase(c.p))}</b><small>${cvH(c.areas.map(a=>CV_AREAS[a]).join(' · '))} · ${c.load} aulas/dia</small><em>${info.recommended&&cvNorm(c.p)===cvNorm(info.recommended.p)?'Recomendado · ':''}${c.confirmed?'Disponibilidade confirmada':'A confirmar'}</em></span></button>`).join('')||'<p class="cv-note">Nenhum substituto sem conflito para este horário.</p>'}</div>`;}
function cvModalChoose(name){if(!$('exP'))return;$('exP').value=name;cvModalDraw(name);const button=$('sheet').querySelector('[onclick^="applyExc"]');if(button)button.disabled=!name||cvModal.date!==cvToday();}
const cvBeforeModalApply=applyExc;
applyExc=function(slotJSON,className){if(!cvRequire())return;if(!cvModal||cvModal.className!==className||cvModal.slot.t!==JSON.parse(slotJSON).t)return cvBeforeModalApply(slotJSON,className);const name=$('exP').value;if(!name)return toast('Selecione um substituto disponível.');const c=cvModal.list.find(c=>cvNorm(c.p)===cvNorm(name));if(!c&&!effectiveSlot(cvModal.slot,className)._exc)return toast('Selecione um professor da lista.');if(c&&!c.confirmed&&!confirm('Confirma a presença e a liberação de '+titleCase(name)+' para esta aula?'))return;const info=cvModal,key=excKey(className,info.slot.day,info.slot.t),before=JSON.stringify(state.exceptions[key]);cvBeforeModalApply(slotJSON,className);if(JSON.stringify(state.exceptions[key])!==before&&state.exceptions[key]?.p===name&&c&&!c.confirmed){cvData.records.push({id:cvId(),teacher:name,date:info.date,start:toMin(info.slot.t),end:toMin(info.slot.t)+durationOf(info.slot),kind:'confirmed',note:''});cvSave();}};
// A página cresce conforme o conteúdo; painéis deixam de cortar as listas.
cvFitWorkspace=function(){};
cvReasonShort=function(c){return c.related?'Mesma área':'Outra área';};

boot();
</script>
<!-- Área de impressão geral (resumo da escola por turma / por professor).
     Só fica visível durante window.print(). Preenchida via JS. -->
<div id="printRoot"></div>

</body>
</html>
